bio: |
  현재 한국수자원공사(K-water) 연구원 AI연구소장을 맡고 있습니다.
  KAIST에서 토목공학 학사·석사와 건설및환경공학 박사를 마쳤고, 환경·수리학과 슈퍼컴퓨터 활용을 바탕으로
  물관리 현장 데이터와 AI를 연결해 연구자가 가설·실험·검증을 더 빠르게 반복할 수 있는
  Water Co-Scientist 체계를 만들고 있습니다. 수자원 디지털트윈 플랫폼 구축과 국가 AI 정책 자문에도 참여하고 있습니다.

interests:
