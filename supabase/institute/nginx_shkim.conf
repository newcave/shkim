# ai4water.kwaterai.com 의 server { listen 443 … } 블록 안, 기존 'location /' 보다 위에 넣는다.
# 이 경로 하나만 shkim 전용 PostgREST(서버 안 127.0.0.1:3101)로 보낸다. 다른 경로·WCS 문(8512)·로그인 화면과 무관.
# 열쇠 확인은 PostgREST가 한다 (열쇠 없으면 401). 끝의 '/'를 둘 다 붙여야 앞부분(/shkim-db/rest/v1)이 떼어진다.
location /shkim-db/rest/v1/ {
    proxy_pass http://127.0.0.1:3101/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 2m;
}
