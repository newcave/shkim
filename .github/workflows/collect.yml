name: collect

on:
  schedule:
    - cron: "0 21 * * *"      # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "몇 일 전까지 수집할지"
        default: "14"
        required: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # 연구소 서버는 shkim (supabase/institute/README.md). 비우면 public = supabase.com 프로젝트
      SUPABASE_SCHEMA: ${{ vars.SUPABASE_SCHEMA || secrets.SUPABASE_SCHEMA || '' }}
    steps:
      - name: DB 연결 정보 확인
        id: chk
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning title=수집 건너뜀::SUPABASE_URL·SUPABASE_SERVICE_KEY가 아직 없습니다 (연구소 서버 준비 중 — supabase/institute/README.md). 넣으면 다음 실행부터 수집합니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 서버에 닿는지 먼저 본다 (열쇠는 출력하지 않음)
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 \
            -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Accept-Profile: ${SUPABASE_SCHEMA:-public}" \
            "${SUPABASE_URL%/}/rest/v1/sources?select=id&limit=1" || true)
          case "$code" in
            200) echo "DB 연결 확인 (스키마 ${SUPABASE_SCHEMA:-public})" ;;
            000) echo "::error title=DB 접속 안 됨::${SUPABASE_URL%/} 에 닿지 않습니다 (시간 초과·연결 거부). 서버 방화벽이 바깥(GitHub) 접속을 막는지 확인" ; exit 1 ;;
            401|403) echo "::error title=열쇠 거절 ($code)::SUPABASE_SERVICE_KEY가 이 서버의 열쇠인지, SUPABASE_SCHEMA가 맞는지 확인" ; exit 1 ;;
            404) echo "::error title=주소 확인 (404)::SUPABASE_URL 경로(…/shkim-db)와 서버의 길 설정(nginx location)이 맞는지 확인" ; exit 1 ;;
            406) echo "::error title=스키마 확인 (406)::SUPABASE_SCHEMA='${SUPABASE_SCHEMA:-}'를 서버가 열어 두지 않았습니다 (연구소 서버는 shkim — 저장소 Variables에 SUPABASE_SCHEMA)" ; exit 1 ;;
            *) echo "::warning::DB 확인 응답 $code — 수집을 그대로 시도합니다" ;;
          esac
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - if: steps.chk.outputs.ok == 'true'
        uses: actions/checkout@v5
      - if: steps.chk.outputs.ok == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.chk.outputs.ok == 'true'
        run: pip install -r requirements-collector.txt
      - name: Run collector
        if: steps.chk.outputs.ok == 'true'
        env:
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARIZE: ${{ vars.SUMMARIZE || '0' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
        run: python -m collector.collect
