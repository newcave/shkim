name: collect

on:
  schedule:
    - cron: "0 21 * * *"      # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "몇 일 전까지 수집할지"
        default: "14"
        required: false

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-collector.txt
      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUMMARIZE: ${{ vars.SUMMARIZE || '0' }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '14' }}
        run: python -m collector.collect
